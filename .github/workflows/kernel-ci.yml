name: MARTYNE LINUX kernel CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main
      - "dev/**"

permissions:
  contents: read

jobs:
  aarch64-build-and-qemu:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install AArch64 build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make qemu-system-arm

      - name: Build freestanding kernel
        run: |
          make clean
          make

      - name: Boot kernel and verify timer IRQ
        run: make qemu-test
